[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spins2"
version = "0.0.5"
description = "DEPRECATED: spins2 has been merged into mcta. Install mcta and use the `mt.mc` command."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kan" }]
keywords = ["Monte Carlo", "Ising", "magnetism", "spin", "phase transition"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "mcta>=0.0.2",
    "numba>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/lkccrr/mcta"
Source   = "https://github.com/lkccrr/mcta"
"Legacy repository (archived)" = "https://github.com/lkccrr/spins2"

[tool.setuptools]
packages = ["spins2"]
